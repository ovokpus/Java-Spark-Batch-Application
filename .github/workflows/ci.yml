name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  maven-tests:
    name: Maven tests (JUnit + local Spark on H2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '11', cache: maven }
      - run: mvn -B test

  viewer-tests:
    name: Viewer API tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: viewer } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.8.4" }
      - run: uv sync --frozen
      - run: uv run pytest -q

  frontend:
    name: Frontend type-check + build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm run build

  images:
    name: docker compose build
    runs-on: ubuntu-latest
    needs: [maven-tests, viewer-tests, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
