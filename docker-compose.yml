services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-batch}
      POSTGRES_USER: ${POSTGRES_USER:-batch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-batch}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pg-data:/var/lib/postgresql/data
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  # The Spark job: runs the pipeline once and exits. Re-run with `docker compose run --rm batch`.
  batch:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-batch}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-batch}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-batch}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPARK_MASTER_MODE: local[*]
      SELLERS: ${SELLERS:-Joe,Beth,Janet}
      DATES: ${DATES:-20201111000000 20201112000000 20201113000000}
      PRODUCTS: ${PRODUCTS:-Beer Food Car}
    depends_on:
      db: { condition: service_healthy }

  api:
    build: ./viewer
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-batch}:${POSTGRES_PASSWORD:-batch}@db:5432/${POSTGRES_DB:-batch}
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 20

  frontend:
    build: ./frontend
    ports: ["${UI_PORT:-8080}:80"]
    depends_on: [api]

volumes:
  pg-data:
