## Spring Datasource configuration properties
## Defaults: in-memory H2 seeded from schema.sql/data.sql (used by `mvn test` and a plain `java -jar`).
## docker compose overrides these with SPRING_DATASOURCE_* env vars to point at PostgreSQL (see .env.example).
spring.datasource.url = jdbc:h2:mem:data
spring.datasource.username=admin
spring.datasource.password=password
spring.datasource.driver-class-name=org.h2.Driver
#spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.main.banner-mode=off

##Spark Mode and Params defaults - Add other profiles below for live execution (Cluster), etc.
spark.master.mode = local[*]
